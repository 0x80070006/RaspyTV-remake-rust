[package]
name = "raspytv-ui"
description = "Accueil et paramètres de RaspyTV, compilés en WebAssembly."
version.workspace = true
publish = false
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement", "Node", "NodeList", "DomRect", "DomTokenList",
  "Event", "EventTarget", "KeyboardEvent", "KeyboardEventInit", "MouseEvent", "WheelEvent", "FocusEvent",
  "HtmlInputElement", "HtmlSelectElement", "HtmlFormElement", "HtmlButtonElement", "HtmlOptionElement",
  "HtmlCollection", "HtmlImageElement", "HtmlVideoElement", "HtmlMediaElement", "HtmlAudioElement",
  "CssStyleDeclaration", "FormData", "Location", "UrlSearchParams", "ScrollIntoViewOptions", "ScrollLogicalPosition",
  "ScrollBehavior", "FocusOptions", "MediaQueryList", "Performance", "AddEventListenerOptions", "Storage",
] }

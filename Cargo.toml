[workspace]
resolver = "2"
members = ["crates/core", "crates/ui", "crates/shell"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.release.package.raspytv-ui]
opt-level = "z"
